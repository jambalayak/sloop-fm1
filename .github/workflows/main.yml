name: Build HORATIO-1 firmware and SLOOP reference

on:
  workflow_dispatch:
  push:
    branches:
      - plaits-development

permissions:
  contents: read

concurrency:
  group: horatio-1-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil git curl xz-utils

      - name: Install JieLi compiler
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: Download JieLi SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
            "$HOME/fw-AC79_AIoT_SDK"
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Verify Plaits C++ toolchain
        run: python3 tools/build.py --check-plaits-cxx

      - name: Compile firmware
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test keyboard scale mapping
        run: |
          cc -O2 -w -Ibuild/gen -Ifirmware/src -o build/scale_test tests/scale_test.c -lm
          build/scale_test

      - name: Save SLOOP reference package
        uses: actions/upload-artifact@v4
        with:
          name: sloop-reference-firmware
          path: build/felucca.fwsc
          if-no-files-found: error
          retention-days: 14

      - name: Compile HORATIO-1 firmware
        run: |
          rm -rf build
          HORATIO_PLAITS=1 ./build.sh

      - name: Check HORATIO factory preset browser
        run: python3 tools/check_horatio_preset_bank.py

      - name: Run Plaits audio smoke test
        run: |
          g++ -O2 -std=gnu++11 -DTEST -D_GNU_SOURCE \
            -include /usr/include/c++/11/cmath -include /usr/include/stdio.h \
            -Ifirmware/cxx -Ifirmware/src -Ithird_party -Ithird_party/eurorack \
            $(find third_party/eurorack/plaits/dsp -name '*.cc' -print) \
            third_party/eurorack/plaits/resources.cc \
            third_party/stmlib/dsp/units.cc \
            third_party/stmlib/utils/random.cc \
            firmware/cxx/horatio_plaits.cc tests/horatio_plaits_smoke.cc \
            -lm -o build/horatio_plaits_smoke
          ./build/horatio_plaits_smoke

      - name: Save HORATIO-1 package
        uses: actions/upload-artifact@v4
        with:
          name: horatio-1-firmware
          path: build/felucca.fwsc
          if-no-files-found: error
          retention-days: 14
